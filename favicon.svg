<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- C++ Main Fill Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Neon Plus Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" filter="url(#badgeGlow)" />

  <!-- Subtle Cyber Tech Grid Accent -->
  <path d="M72 170 H440 M72 342 H440 M170 72 V440 M342 72 V440" stroke="rgba(56, 189, 248, 0.08)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Left Code Bracket < -->
  <path d="M120 180 L64 256 L120 332" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" opacity="0.9" />

  <!-- Right Code Bracket > -->
  <path d="M392 180 L448 256 L392 332" fill="none" stroke="#818cf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" opacity="0.9" />

  <!-- Center 'C' Letter in Futuristic Geometry -->
  <g filter="url(#neonGlow)">
    <!-- Arc for 'C' -->
    <path d="M 245 185
             A 75 75 0 1 0 245 327"
          fill="none"
          stroke="url(#textGrad)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Terminal dot accents for C -->
    <circle cx="245" cy="185" r="9" fill="#38bdf8" />
    <circle cx="245" cy="327" r="9" fill="#38bdf8" />

    <!-- First Plus '+' -->
    <g transform="translate(278, 224)">
      <!-- Horizontal bar -->
      <line x1="0" y1="32" x2="40" y2="32" stroke="url(#plusGrad)" stroke-width="16" stroke-linecap="round" />
      <!-- Vertical bar -->
      <line x1="20" y1="12" x2="20" y2="52" stroke="url(#plusGrad)" stroke-width="16" stroke-linecap="round" />
    </g>

    <!-- Second Plus '+' -->
    <g transform="translate(326, 224)">
      <!-- Horizontal bar -->
      <line x1="0" y1="32" x2="40" y2="32" stroke="url(#plusGrad)" stroke-width="16" stroke-linecap="round" />
      <!-- Vertical bar -->
      <line x1="20" y1="12" x2="20" y2="52" stroke="url(#plusGrad)" stroke-width="16" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Binary & Tech Glow Accent Dots -->
  <circle cx="196" cy="405" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="226" cy="405" r="5" fill="#818cf8" opacity="0.9" />
  <circle cx="256" cy="405" r="6" fill="#c084fc" filter="url(#neonGlow)" />
  <circle cx="286" cy="405" r="5" fill="#818cf8" opacity="0.9" />
  <circle cx="316" cy="405" r="5" fill="#38bdf8" opacity="0.8" />
</svg>